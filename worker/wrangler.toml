name = "ftc-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true
 
# Cron: sync active events every 2 minutes
[triggers]
crons = ["*/2 * * * *"]
 
# Raise the subrequest limit to the maximum (default is 50).
# Each event fetch makes 2 subrequests (schedule + scores),
# so without this you hit the wall after ~25 events.
# This is set to 1000 so it never needs touching in future seasons.
[limits]
subrequests = 1000
 
# KV namespace binding
# Create with: wrangler kv:namespace create FTC_KV
# Then paste the id below
[[kv_namespaces]]
binding = "FTC_KV"
id = "8a3fd3207d1942c89dac2f96e08188b4"
 
# Secrets — set these with:
#   wrangler secret put FTC_USER
#   wrangler secret put FTC_KEY
# They will NOT appear in this file (that's intentional)
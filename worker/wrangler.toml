name = "ftc-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

# Cron: sync active events every 2 minutes
[triggers]
crons = ["*/2 * * * *"]

# KV namespace binding
# Create with: wrangler kv:namespace create FTC_KV
# Then paste the id below
[[kv_namespaces]]
binding = "FTC_KV"
id = "a6ea8922d2ed4370a7e0cf6de6d6ca3b"

# Secrets — set these with:
#   wrangler secret put FTC_USER
#   wrangler secret put FTC_KEY
# They will NOT appear in this file (that's intentional)